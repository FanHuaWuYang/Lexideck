[package]
name = "lexideck"
version = "0.1.0"
edition = "2021"
description = "悬浮在教室一体机屏幕上的英语词卡看板（内容由外部词表文件驱动）"

[dependencies]
eframe = { version = "0.36", default-features = false, features = ["glow", "default_fonts"] }
egui_extras = { version = "0.36", features = ["image"] }
encoding_rs = "0.8"
rfd = "0.17.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
