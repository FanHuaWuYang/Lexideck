[package]
name = "lexideck"
version = "0.1.1"
edition = "2021"
description = "悬浮在教室一体机屏幕上的英语词卡看板（内容由外部词表文件驱动）"

[dependencies]
eframe = { version = "0.36", default-features = false, features = ["glow", "default_fonts"] }
egui_extras = { version = "0.36", features = ["image"] }
encoding_rs = "0.8"
rfd = "0.17.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tray-icon = "0.26.0"

# 托盘唤醒要用面板窗口的 HWND：
# raw-window-handle 从 eframe::Frame 取句柄，windows-sys 发 PostMessage（版本选 0.61
# 是因为 tray-icon 已经带了同一版，不额外多编一份）。
[target.'cfg(windows)'.dependencies]
raw-window-handle = "0.6"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

# 开发构建也要能跑得动动画：egui/epaint 这些依赖必须优化编译（它们才是每帧的大头），
# 自己的代码留 opt-level 1（保住调试信息，增量编译也快）。
# 实测：全 opt-level 0 时面板每帧 34.5ms → 卡片入场动画只有 29fps，实机上手感就是"卡"。
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
